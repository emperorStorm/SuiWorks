# 仅为模板：替换 example.invalid 和证书路径后才可启用。
server {
    listen 80;
    server_name example.invalid;
    include /etc/nginx/snippets/suiworks-security-headers.conf;
    return 301 https://example.invalid$request_uri;
}

server {
    listen 443 ssl;
    server_name example.invalid;
    ssl_certificate /etc/nginx/certs/example.invalid/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SuiWorksTLS:10m;
    ssl_session_timeout 1d;

    root /opt/suiworks/current/web;
    index index.html;
    autoindex off;
    server_tokens off;
    include /etc/nginx/snippets/suiworks-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    error_page 404 /404.html;

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.html$ {
        try_files $uri =404;
    }

    location ~* ^/assets/.+-[A-Za-z0-9_-]{8,}\.(?:js|css|woff2?|ttf|otf|png|jpe?g|gif|svg|webp|avif|ico)$ {
        try_files $uri =404;
        include /etc/nginx/snippets/suiworks-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
